services:
  mysql:
    image: mysql:8.4.5
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_ON_FIRST_RUN}
      MYSQL_DATABASE: ${DB_DATABASE:-xinshangcheng003}
      MYSQL_USER: ${DB_USERNAME:-xinshangcheng}
      MYSQL_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_ON_FIRST_RUN}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-CHANGE_ME_ON_FIRST_RUN}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1024M
    networks:
      - app-network

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        if [ -n "${REDIS_PASSWORD:-}" ]; then
          exec redis-server --requirepass "${REDIS_PASSWORD}"
        fi
        exec redis-server
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "${REDIS_PASSWORD:-}" ]; then
            redis-cli -a "${REDIS_PASSWORD}" ping
          else
            redis-cli ping
          fi
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256M
    networks:
      - app-network

  api:
    image: fenglianshop/api:${VERSION:-v6.20260611.003}
    restart: unless-stopped
    environment:
      APP_EDITION: ${APP_EDITION:-single}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-public_dockerhub}
      APP_VERSION: ${VERSION:-v6.20260611.003}
      AGENT_TOOLKIT_DIR: ${AGENT_TOOLKIT_DIR:-/host/public-update-toolkit}
      SAFE_DB_INIT: "true"
      APP_URL: ${API_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-xinshangcheng003}
      DB_USERNAME: ${DB_USERNAME:-xinshangcheng}
      DB_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_ON_FIRST_RUN}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      UPDATE_MGMT_BASE_URLS: ${UPDATE_MGMT_BASE_URLS:-}
      AGENT_BOOTSTRAP_SECRET: ${AGENT_BOOTSTRAP_SECRET:-update_mgmt_secret_2026}
      APP_KEY: ${APP_KEY:-}
    volumes:
      - api_storage:/var/www/html/storage
      - api_uploads:/var/www/html/public/uploads
      - plugin_data:/var/www/html/plugins
      - ./update-toolkit:/host/public-update-toolkit:rw

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768M
    networks:
      - app-network

  nginx-api:
    image: fenglianshop/nginx-api:${VERSION:-v6.20260611.003}
    restart: unless-stopped
    volumes:
      - api_uploads:/var/www/html/public/uploads:ro
      - api_storage:/var/www/html/storage:ro
    depends_on:
      - api
    mem_limit: 256M
    networks:
      - app-network

  admin:
    image: fenglianshop/admin:${VERSION:-v6.20260611.003}
    restart: unless-stopped
    volumes:
      - plugin_data:/usr/share/nginx/html/plugins:ro
    mem_limit: 256M
    networks:
      - app-network

  h5:
    image: fenglianshop/h5:${VERSION:-v6.20260611.003}
    restart: unless-stopped
    environment:
      APP_URL: ${API_URL:-}
      APP_ENV: ${APP_ENV:-production}
    mem_limit: 256M
    networks:
      - app-network

  caddy:
    image: fenglianshop/caddy:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8880}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      - ALIYUN_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID:-}
      - ALIYUN_SECRET_KEY=${ALIYUN_SECRET_KEY:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - admin
      - h5
      - nginx-api
    mem_limit: 80M
    networks:
      - app-network

  # ============================================
  # 小程序上传 Worker（公开版单开）
  # 🔴 仅挂 app-network，不对外暴露端口
  # ============================================
  mp-upload-worker:
    image: fenglianshop/mp-upload-worker:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-xinshangcheng}_mp-upload-worker
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      APP_ENV: production
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-xinshangcheng003}
      DB_USERNAME: mp_worker
      DB_PASSWORD: ${MP_WORKER_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QUEUE_CONNECTION: mp-upload-redis
      TENANT_ENABLED: "false"
      MP_ASYNC_UPLOAD: "true"
      IS_MP_WORKER: "true"
    volumes:
      - api_storage:/var/www/html/storage
    tmpfs:
      - /var/www/html/storage/app/mp-upload/tmp:size=64M,mode=0700,uid=33,gid=33
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work.*mp-upload' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    mem_limit: 1024M
    mem_reservation: 512M

volumes:
  mysql_data:
  redis_data:
  api_storage:
  api_uploads:
  plugin_data:

  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
