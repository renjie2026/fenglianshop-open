services:
  mysql:
    image: mysql:8.4.5
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_ON_FIRST_RUN}
      MYSQL_DATABASE: ${DB_DATABASE:-xinshangcheng003}
      MYSQL_USER: ${DB_USERNAME:-xinshangcheng}
      MYSQL_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_ON_FIRST_RUN}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-CHANGE_ME_ON_FIRST_RUN}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1024M
    networks:
      - app-network

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256M
    networks:
      - app-network

  api:
    image: fenglianshop/api:${VERSION:-v6.20260603.005-preview}
    restart: unless-stopped
    environment:
      APP_EDITION: ${APP_EDITION:-single}
      SAFE_DB_INIT: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-xinshangcheng003}
      DB_USERNAME: ${DB_USERNAME:-xinshangcheng}
      DB_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_ON_FIRST_RUN}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      UPDATE_MGMT_BASE_URLS: ${UPDATE_MGMT_BASE_URLS:-}
    volumes:
      - api_storage:/var/www/html/storage
      - api_uploads:/var/www/html/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768M
    networks:
      - app-network

  nginx-api:
    image: fenglianshop/nginx-api:${VERSION:-v6.20260603.005-preview}
    restart: unless-stopped
    depends_on:
      - api
    mem_limit: 256M
    networks:
      - app-network

  admin:
    image: fenglianshop/admin:${VERSION:-v6.20260603.005-preview}
    restart: unless-stopped
    mem_limit: 256M
    networks:
      - app-network

  h5:
    image: fenglianshop/h5:${VERSION:-v6.20260603.005-preview}
    restart: unless-stopped
    mem_limit: 256M
    networks:
      - app-network

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8880}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - admin
      - h5
      - nginx-api
    mem_limit: 80M
    networks:
      - app-network

volumes:
  mysql_data:
  redis_data:
  api_storage:
  api_uploads:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
